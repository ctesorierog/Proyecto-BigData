# Test cluster: HDFS (1 namenode + 2 datanodes) + Spark standalone (1 master + 2 workers)
# YARN is left out on purpose to save RAM; Spark uses its own standalone scheduler.
# Run from this folder:  docker compose up -d
name: pruebas

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: pruebas-namenode
    restart: unless-stopped
    ports:
      - 9870:9870   # HDFS web UI
      - 9000:9000   # HDFS RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - /home/shadow33/zipmuygrande:/data:ro   # airline CSVs, to load with hdfs dfs -put
    environment:
      - CLUSTER_NAME=pruebas
      - HDFS_CONF_dfs_replication=2
    env_file:
      - ../hadoop.env

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: pruebas-datanode1
    restart: unless-stopped
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      HDFS_CONF_dfs_replication: 2
    env_file:
      - ../hadoop.env

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: pruebas-datanode2
    restart: unless-stopped
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      HDFS_CONF_dfs_replication: 2
    env_file:
      - ../hadoop.env

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: pruebas-spark-master
    restart: unless-stopped
    ports:
      - 8080:8080   # Spark master web UI
      - 7077:7077   # Spark master RPC
    environment:
      - INIT_DAEMON_STEP=setup_spark
    depends_on:
      - namenode

  spark-worker1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: pruebas-spark-worker1
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2560m
    depends_on:
      - spark-master

  spark-worker2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: pruebas-spark-worker2
    restart: unless-stopped
    ports:
      - 8082:8081
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2560m
    depends_on:
      - spark-master

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
