name: proyecto-bigdata

# Settings shared by all Hadoop containers (written once, reused below)
x-hadoop-env: &hadoop-env
  CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
  CORE_CONF_hadoop_http_staticuser_user: "root"
  HDFS_CONF_dfs_replication: "2"
  HDFS_CONF_dfs_webhdfs_enabled: "true"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

services:
  # The librarian: keeps the catalog of which block is on which DataNode
  namenode:
    image: proyecto-bigdata/namenode-python:hadoop3.2.1
    build: ./docker/hadoop-python      # bde2020 NameNode + python3 for Hadoop Streaming
    hostname: namenode
    restart: unless-stopped
    environment:
      <<: *hadoop-env
      CLUSTER_NAME: "proyecto-bigdata"
    ports:
      - "9870:9870"   # HDFS web page
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./data:/data:ro   # your laptop's data/ folder, visible inside as /data
      - ./mapreduce:/opt/mapreduce:ro   # Hadoop Streaming scripts (workstream 3)

  # The shelves: store the 128 MB blocks
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode1
    restart: unless-stopped
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode2
    restart: unless-stopped
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data

  # The boss: splits work into tasks and hands them to workers
  spark-master:
    image: &spark-image quay.io/jupyter/pyspark-notebook@sha256:80430186e2e97c5e0a9a3c117798d4007bc0a289b8a72cf3a9fc92f044b4c4f1
    hostname: spark-master
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"   # Spark master web page

  # The readers: run the tasks (2 cores, 2 GB each)
  spark-worker1:
    image: *spark-image
    hostname: spark-worker1
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "--webui-port", "8081",
              "--work-dir", "/tmp/spark-work",
              "spark://spark-master:7077"]
    environment:
      HADOOP_USER_NAME: "root"
    volumes:
      - ./:/home/jovyan/work
    ports:
      - "8081:8081"
    depends_on:
      - spark-master

  spark-worker2:
    image: *spark-image
    hostname: spark-worker2
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "--webui-port", "8081",
              "--work-dir", "/tmp/spark-work",
              "spark://spark-master:7077"]
    environment:
      HADOOP_USER_NAME: "root"
    volumes:
      - ./:/home/jovyan/work
    ports:
      - "8082:8081"
    depends_on:
      - spark-master

  # Your desk: Jupyter, where you write PySpark (the "driver")
  jupyter:
    image: *spark-image
    hostname: jupyter
    restart: unless-stopped
    environment:
      HADOOP_USER_NAME: "root"
      PYSPARK_SUBMIT_ARGS: >-
        --master spark://spark-master:7077
        --driver-memory 1g
        --executor-memory 1g
        --executor-cores 2
        --conf spark.hadoop.dfs.replication=2
        pyspark-shell
    volumes:
      - ./:/home/jovyan/work
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark job page (only while a job runs)
    depends_on:
      - spark-master
      - namenode

# Docker-managed storage so HDFS data survives restarts
volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2: